# 复制为 settings.toml 后填写本机路径。settings.toml 不会提交到 Git。
# 相对路径均相对于本文件所在目录，而不是命令执行目录。

linux_dir = ""
hashes_file = ""
outdir = "analysis_out"
context_md = "documents/新·论文思路梳理.md"
evidence_dir = ""

workers = 8
force = false
max_tokens = 8192
max_diff_chars = 50000
start_index = 0
end_index = -1

[openai]
# 密钥本身不要写入 settings；这里只配置密钥文件路径。
api_key_file = "OPENAI_API_KEY"
base_url = "https://llmapi.isrc.ac.cn/v1"
model = "DeepSeek-V4-Pro"