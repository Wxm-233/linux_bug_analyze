# 复制为 settings.toml 后填写本机路径。settings.toml 不会提交到 Git。
# 相对路径均相对于本文件所在目录，而不是命令执行目录。

linux_dir = ""
hashes_file = ""
outdir = "analysis_out"
context_md = "documents/新·论文思路梳理.md"
evidence_dir = ""

workers = 8
force = false
max_tokens = 8192
max_diff_chars = 50000
start_index = 0
end_index = -1

[openai]
# 密钥本身不要写入 settings；这里只配置密钥文件路径。
api_key_file = "OPENAI_API_KEY"
base_url = "https://llmapi.isrc.ac.cn/v1"
model = "DeepSeek-V4-Pro"

[hash_filter]
# 未筛选的候选 hash；筛选结果默认写入根级 hashes_file。
source_file = "candidate_hashes.txt"
output_file = ""
audit_file = ""

# 高召回筛选：架构路径、完整架构名称、跨架构措辞和常见边界语义。
# 命中只代表“值得交给 LLM 分析”，不代表最终相关。
include = [
  '(?:^|/)arch/(?:alpha|arc|arm|arm64|csky|h8300|hexagon|ia64|loongarch|m68k|microblaze|mips|nds32|nios2|openrisc|parisc|powerpc|riscv|s390|sh|sparc|um|x86|xtensa)(?:/|$)',
  '\b(?:alpha|arc|arm(?:32)?|arm64|aarch64|csky|h8300|hexagon|ia64|loongarch|m68k|microblaze|mips|nds32|nios2|openrisc|pa-?risc|powerpc|ppc|risc[- ]?v|s390|sh|superh|sparc|uml|x86(?:[_-]64)?|i[3-6]86|xtensa)\b',
  '\b(?:cross[- ]arch(?:itecture)?|multi[- ]arch(?:itecture)?|arch(?:itecture)?[- ](?:specific|dependent|independent)|other architectures?|all architectures?|portab(?:le|ility))\b',
  '\b(?:big[- ]endian|little[- ]endian|endianness|32[- ]bit|64[- ]bit|word size|page size|byte order|alignment|unaligned|atomicity|memory ordering|memory barrier|cache coherency|cache maintenance|tlb|page tables?|mmio|dma|iommu|irq|interrupt controller|device tree|acpi|kvm)\b',
]
exclude = []
fields = ["subject", "body", "files"]
match = "any"
case_sensitive = false
workers = 8
max_diff_chars = 0

[evidence]
# 可选：保存补丁讨论的其他 public-inbox v2 本地镜像；程序按 Link/Closes Message-ID 匹配。
mail_inbox_dirs = []
# 自动加入 Fixes: 指向的引入提交；CVE 公告自动读取 [cve_source].inbox_dir。
include_fixes_commit = true
max_chars_per_source = 12000
max_total_chars = 36000

[cve_source]
# public-inbox-clone 输出目录、其中的 git 目录，或单个 0.git epoch。
inbox_dir = ""
# 留空时使用 [hash_filter].source_file。
output_file = ""
audit_file = ""
# 只输出 linux_dir 仓库中实际存在的主线提交，过滤 stable 回移提交。
prefer_mainline = true
# 主线提交无法解析时是否退回到邮件中的全部提交；建议保持关闭。
fallback_to_all = false

[result_summary]
# 留空时使用根级 outdir；output_dir 留空时把汇总文件写入分析目录。
input_dir = ""
output_dir = ""
