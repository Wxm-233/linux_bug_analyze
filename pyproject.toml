[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-bug-analyze"
version = "0.2.0"
description = "Analyze Linux multi-architecture semantic bug-fix commits with an LLM"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
linux-bug-analyze = "linux_bug_analyze.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["linux_bug_analyze"]
